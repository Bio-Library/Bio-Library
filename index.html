<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * { font-family: 'Georgia', 'Times New Roman', serif; }
      .mono { font-family: 'Courier New', Courier, monospace; }
      .accent { color: #00C2FF; }
      .accent-bg { background-color: #00C2FF; }
      .accent-border { border-color: #00C2FF; }
      .deep-bg { background-color: #F7F9FC; }
      .card-bg { background-color: #FFFFFF; }
      .dark-bg { background-color: #06111C; }
      .mid-bg { background-color: #0B1E2D; }
      .clinical-shadow { box-shadow: 0 2px 24px rgba(0,194,255,0.08), 0 1px 4px rgba(0,0,0,0.10); }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white border-b-4 border-black">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
          <div class="flex items-center gap-4">
            <div class="w-11 h-11 bg-black flex items-center justify-center">
              <svg width="20" height="20" viewBox="0 0 18 18" fill="none"><path d="M9 1C9 1 2 5 2 10.5C2 14.09 5.13 17 9 17C12.87 17 16 14.09 16 10.5C16 5 9 1 9 1Z" fill="#00C2FF"></path><circle cx="9" cy="10" r="2.5" fill="#06111C"></circle></svg>
            </div>
            <span class="text-black font-black text-2xl tracking-widest uppercase mono" style="letter-spacing:0.18em;">Bio-<span class="accent">Library</span></span>
          </div>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <section class="dark-bg min-h-screen pt-20 flex flex-col justify-center">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24 lg:py-36 w-full">
        <div class="flex flex-col w-full items-center text-center">
          <div class="flex items-center justify-center gap-3 mb-10">
            <div class="h-1 w-8 accent-bg"></div>
            <span class="mono text-sm uppercase tracking-widest accent" style="letter-spacing:0.22em;">Pediatric Tissue Biobank</span>
            <div class="h-1 w-8 accent-bg"></div>
          </div>
          <h1 class="text-4xl sm:text-5xl lg:text-7xl xl:text-8xl font-black text-white leading-none tracking-tight mb-2" style="line-height:1.02;">
            Breakthroughs<br>
            <span class="accent">Built Faster.</span>
          </h1>
          <div class="h-1 my-8 w-48 accent-bg mx-auto"></div>
          <p class="text-gray-300 text-base sm:text-lg max-w-2xl mb-12 leading-relaxed mx-auto" style="line-height:1.85;">
            Biolibrary transforms discarded pediatric surgical tissue and biofluids into searchable, ethically sourced research samples — delivered to your lab with precision and full compliance documentation.
          </p>
        </div>
      </div>
      <div class="h-1 w-full accent-bg"></div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-white py-12 border-t-4 border-black">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-8">
          <div>
            <div class="flex items-center gap-4 mb-3">
              <div class="w-10 h-10 bg-black flex items-center justify-center">
                <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 1C9 1 2 5 2 10.5C2 14.09 5.13 17 9 17C12.87 17 16 14.09 16 10.5C16 5 9 1 9 1Z" fill="#00C2FF"></path></svg>
              </div>
              <span class="text-black font-black text-xl uppercase tracking-widest mono" style="letter-spacing:0.18em;">Bio-<span class="accent">Library</span></span>
            </div>
            <p class="mono text-sm text-gray-400" style="letter-spacing:0.1em;">2026 Bio-Library.</p>
          </div>
        </div>
        <div class="h-1 mt-10 accent-bg"></div>
      </div>
    </footer>

</body>
</html>
